
name: Build SG Taekwon-Do News

on:
  push:
    branches:
      - main
    paths:
      - 'articles/**'
      - 'assets/news/**'
      - 'build_news.py'
      - 'news.html'
      - '.github/workflows/build-news.yml'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-sgtk-news
  cancel-in-progress: false

jobs:
  build-news:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Markdown dependency
        run: python -m pip install Markdown

      - name: Build article pages
        run: python build_news.py

      - name: Commit generated news pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.html news/
          if ! git diff --cached --quiet; then
            git commit -m "Build published news articles"
            git push origin HEAD:main
          else
            echo "No generated news changes to commit."
          fi
