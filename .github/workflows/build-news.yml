
name: Build SG Taekwon-Do News

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-news:
    runs-on: ubuntu-latest

    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Markdown dependency
        run: python -m pip install Markdown

      - name: Check article and cover files
        run: |
          echo "Branch:"
          git branch --show-current
          echo "Article files:"
          find articles -maxdepth 1 -type f -print
          echo "Cover files:"
          find assets/news -maxdepth 1 -type f -print
          test -f articles/2026-10-09-test-news-article.md
          test -f assets/news/test-cover.jpg

      - name: Run news generator
        run: python build_news.py

      
      - name: Check generated files
        run: |
          echo "Generated article pages:"
          find news -maxdepth 1 -type f -print
          test -f news/2026-10-09-test-news-article.html
          grep -q "Test News Article" news.html
          echo "Article page and News tile generated successfully."


      - name: Upload generated news for inspection
        uses: actions/upload-artifact@v4
        with:
          name: test-news-generated-files
          path: |
            news/
            news.html
          if-no-files-found: error


      - name: Upload generated news for inspection
        uses: actions/upload-artifact@v4
        with:
          name: test-news-generated-files
          path: |
            news/
            news.html
            styles.css
            script.js
            assets/
          if-no-files-found: error

