name: Build Fillable Student Forms
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_fillable_forms.py'
      - '.github/workflows/build-fillable-forms.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install reportlab
      - run: python scripts/build_fillable_forms.py
      - name: Commit generated PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/SG_Taekwondo_Health_Declaration_Fillable.pdf downloads/SG_Taekwondo_Photo_Video_Consent_Fillable.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Add fillable student forms"
            git push
          fi
